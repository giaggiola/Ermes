name: Ermes checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ermes
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: ermes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ermes -d ermes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ermes:synthetic-ci-password@localhost:5432/ermes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: docker build -f Dockerfile.web -t ermes-web:test .
      - run: docker build -f Dockerfile.worker -t ermes-worker:test .
